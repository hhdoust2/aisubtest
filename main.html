<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم زیرنویس هوش مصنوعی (Groq)</title>
    <style>
        :root {
            --bg-color: #121212; /* پس‌زمینه تیره هماهنگ با پروژه اول */
            --card-bg: #1e1e1e; /* کارت تیره */
            --primary: #4f46e5; /* رنگ بنفش دکمه‌ها */
            --primary-hover: #4338ca;
            --text-main: #e0e0e0;
            --text-muted: #a3a3a3;
            --input-bg: #252525;
            --border-color: #4b5563;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            box-sizing: border-box;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px; /* افزایش جزئی برای همسان‌سازی ظاهر دکمه‌های API */
        }
        h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }
        
        /* بخش مدیریت API */
        .api-manager-box {
            background-color: #252525;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #374151;
            text-align: right;
        }
        .api-manager-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #a5b4fc;
            display: block;
        }
        .api-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .api-label-input {
            width: 35%;
            padding: 10px;
            background-color: #1e1e1e;
            border: 1px solid #4b5563;
            border-radius: 8px;
            color: white;
            font-size: 13px;
        }
        .api-key-input {
            flex-grow: 1;
            padding: 10px;
            background-color: #1e1e1e;
            border: 1px solid #4b5563;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            text-align: left;
            direction: ltr;
        }
        .add-api-btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: background-color 0.2s;
        }
        .add-api-btn:hover { background-color: #4338ca; }
        
        .api-selector-group {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 5px;
            margin-bottom: 12px;
        }
        .api-select {
            flex-grow: 1;
            padding: 10px;
            background-color: #1e1e1e;
            border: 1px solid #4b5563;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            cursor: pointer;
        }
        .delete-api-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .delete-api-btn:hover { background-color: #dc2626; }

        /* دکمه‌های جدید پشتیبان‌گیری */
        .backup-group {
            display: flex;
            gap: 8px;
            border-top: 1px solid #374151;
            padding-top: 12px;
            margin-top: 5px;
        }
        .backup-btn {
            flex: 1;
            background-color: #1f2937;
            color: #d1d5db;
            border: 1px solid #4b5563;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .backup-btn:hover {
            background-color: #374151;
            color: #fff;
            border-color: #6b7280;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #a5b4fc; /* رنگ لیبل ملایم هماهنگ با پروژه اول */
            font-weight: bold;
            font-size: 14px;
        }
        
        /* استایل اختصاصی دکمه انتخاب فایل مدرن و هماهنگ */
        .file-input-wrapper {
            position: relative;
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: none; /* پنهان کردن فیلد زشت پیش‌فرض مرورگر */
        }
        .custom-file-upload {
            border: 2px dashed #4f46e5;
            display: block;
            padding: 18px 20px;
            cursor: pointer;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
            background-color: #252525;
            color: #e0e0e0;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
            text-align: center;
        }
        .custom-file-upload:hover {
            background-color: #4f46e5;
            color: #fff;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            background-color: var(--input-bg);
            color: #fff;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        select:focus {
            outline: none;
            border-color: var(--primary);
        }
        select option {
            background-color: var(--input-bg);
            color: #fff;
        }
        button.btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn-submit:hover {
            background-color: var(--primary-hover);
        }
        button.btn-submit:disabled {
            background-color: #4b5563;
            cursor: not-allowed;
        }
        
        /* استایل‌های نوار پیشرفت تیره */
        .progress-container {
            margin-top: 25px;
            display: none;
        }
        .progress-bar-bg {
            width: 100%;
            background-color: #2d2d2d;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #10b981; /* نوار پیشرفت سبز جذاب */
            transition: width 0.4s ease;
            border-radius: 10px;
        }
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
            font-weight: 500;
        }

        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .loading { color: #f59e0b; }
    </style>
</head>
<body>

<div class="container">
    <h2>مترجم زیرنویس هوش مصنوعی (Groq)</h2>
    
    <div class="api-manager-box">
        <span class="api-manager-title">🔑 مدیریت کلید‌های Groq API</span>
        <div class="api-input-group">
            <input type="text" id="apiLabelInput" class="api-label-input" placeholder="مشخصه/نام اکانت">
            <input type="password" id="apiKeyValueInput" class="api-key-input" placeholder="gsk_...">
            <button type="button" class="add-api-btn" id="addApiBtn">ثبت</button>
        </div>
        <div class="api-selector-group">
            <select id="apiSelect" class="api-select">
                <option value="">-- کلید مورد نظر را انتخاب کنید --</option>
            </select>
            <button type="button" class="delete-api-btn" id="deleteApiBtn" title="حذف کلید">🗑️</button>
        </div>
        
        <div class="backup-group">
            <button type="button" class="backup-btn" id="exportBtn">خروجی کلیدها 📥</button>
            <button type="button" class="backup-btn" id="importBtn">وارد کردن کلیدها 📤</button>
            <input type="file" id="importFile" accept=".json" style="display: none;">
        </div>
    </div>

    <form id="uploadForm">
        <!-- طراحی دکمه انتخابی جدید و شیک مشابه پروژه صوت -->
        <div class="form-group file-input-wrapper">
            <label for="srtFile" class="custom-file-upload" id="file-label">
                انتخاب فایل زیرنویس (SRT) 📄
            </label>
            <input type="file" id="srtFile" accept=".srt" required>
        </div>

        <div class="form-group">
            <label for="langTo">ترجمه به زبان:</label>
            <select id="langTo">
                <option value="fa">فارسی (Persian)</option>
                <option value="en">انگلیسی (English)</option>
                <option value="ar">عربی (Arabic)</option>
                <option value="tr">ترکی (Turkish)</option>
            </select>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">شروع ترجمه و دانلود</button>
    </form>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <div class="progress-text">
            <span id="progressPercent">۰%</span>
            <span>در حال پردازش خطوط فیلم...</span>
        </div>
    </div>

    <div id="status"></div>
</div>

<script>
    const apiLabelInput = document.getElementById('apiLabelInput');
    const apiKeyValueInput = document.getElementById('apiKeyValueInput');
    const addApiBtn = document.getElementById('addApiBtn');
    const apiSelect = document.getElementById('apiSelect');
    const deleteApiBtn = document.getElementById('deleteApiBtn');

    // المان‌های پشتیبان‌گیری
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFile = document.getElementById('importFile');

    // المان‌های کنترل فایل و لیبل آن
    const fileInput = document.getElementById('srtFile');
    const fileLabel = document.getElementById('file-label');

    let apiKeysList = [];

    // مدیریت پویای تغییر دکمه فایل بعد از انتخاب
    fileInput.addEventListener('change', function() {
        if (this.files && this.files[0]) {
            const file = this.files[0];
            const sizeKb = (file.size / 1024).toFixed(1);
            fileLabel.textContent = `📄 ${file.name} (${sizeKb} KB)`;
            fileLabel.style.borderColor = '#10b981'; // تغییر رنگ خط‌چین به سبز موفقیت
        } else {
            fileLabel.textContent = 'انتخاب فایل زیرنویس (SRT) 📄';
            fileLabel.style.borderColor = '#4f46e5';
        }
    });

    // ذخیره‌سازی مجزا با کلید اختصاصی groq_translator_keys
    function loadSavedApiKeys() {
        const savedKeys = localStorage.getItem('groq_translator_keys');
        if (savedKeys) {
            try {
                apiKeysList = JSON.parse(savedKeys);
            } catch(e) {
                apiKeysList = [];
            }
        }
        updateApiDropdown();
    }

    function updateApiDropdown() {
        apiSelect.innerHTML = '<option value="">-- کلید مورد نظر را انتخاب کنید --</option>';
        apiKeysList.forEach((item) => {
            const option = document.createElement('option');
            option.value = item.key;
            option.textContent = `${item.label} (${item.key.substring(0, 8)}...)`;
            apiSelect.appendChild(option);
        });

        const lastSelected = localStorage.getItem('last_selected_groq_key');
        if (lastSelected) {
            apiSelect.value = lastSelected;
        }
    }

    addApiBtn.addEventListener('click', function() {
        const label = apiLabelInput.value.trim();
        const key = apiKeyValueInput.value.trim();

        if (!label || !key) {
            alert('لطفاً مشخصه و کلید API را وارد کنید.');
            return;
        }

        apiKeysList.push({ label: label, key: key });
        localStorage.setItem('groq_translator_keys', JSON.stringify(apiKeysList));
        localStorage.setItem('last_selected_groq_key', key);

        apiLabelInput.value = '';
        apiKeyValueInput.value = '';

        updateApiDropdown();
        alert('کلید با موفقیت ذخیره و انتخاب شد!');
    });

    apiSelect.addEventListener('change', function() {
        localStorage.setItem('last_selected_groq_key', this.value);
    });

    deleteApiBtn.addEventListener('click', function() {
        const selectedKey = apiSelect.value;
        if (!selectedKey) {
            alert('لطفاً ابتدا کلیدی را برای حذف انتخاب کنید.');
            return;
        }

        if (confirm('آیا از حذف این کلید مطمئن هستید؟')) {
            apiKeysList = apiKeysList.filter(item => item.key !== selectedKey);
            localStorage.setItem('groq_translator_keys', JSON.stringify(apiKeysList));
            localStorage.removeItem('last_selected_groq_key');
            updateApiDropdown();
        }
    });

    // خروجی گرفتن از کلیدها (Export JSON)
    exportBtn.addEventListener('click', function() {
        if (apiKeysList.length === 0) {
            alert('لیست کلیدهای شما خالی است و چیزی برای پشتیبان‌گیری وجود ندارد.');
            return;
        }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(apiKeysList, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "groq_translator_keys_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    });

    // شبیه‌سازی کلیک روی فیلد اینپوت فایل پشتیبان
    importBtn.addEventListener('click', function() {
        importFile.click();
    });

    // وارد کردن کلیدها (Import JSON)
    importFile.addEventListener('change', function() {
        const file = this.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    const isValid = importedData.every(item => item.hasOwnProperty('label') && item.hasOwnProperty('key'));
                    if (isValid) {
                        if (confirm(`آیا می‌خواهید تعداد ${importedData.length} کلید جدید را به لیست مترجم اضافه کنید؟`)) {
                            const existingKeys = apiKeysList.map(item => item.key);
                            importedData.forEach(item => {
                                if (!existingKeys.includes(item.key)) {
                                    apiKeysList.push(item);
                                }
                            });
                            localStorage.setItem('groq_translator_keys', JSON.stringify(apiKeysList));
                            updateApiDropdown();
                            alert('کلیدهای مترجم با موفقیت بازیابی و به منو اضافه شدند! 🎉');
                        }
                    } else {
                        alert('فرمت فایل وارد شده نامعتبر است. فایل ساختار کلیدهای استاندارد را ندارد.');
                    }
                } else {
                    alert('ساختار فایل باید به صورت یک آرایه JSON معتبر باشد.');
                }
            } catch (err) {
                alert('خطا در خواندن و تجزیه فایل JSON!');
            }
            importFile.value = '';
        };
        reader.readAsText(file);
    });

    loadSavedApiKeys();

    // هندل ارسال فرم
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const apiKey = apiSelect.value;
        if (!apiKey) {
            alert('لطفاً ابتدا یک کلید API وارد یا از منو انتخاب کنید.');
            return;
        }

        const langTo = document.getElementById('langTo').value;
        const statusDiv = document.getElementById('status');
        const btnSubmit = document.getElementById('btnSubmit');
        
        const progressContainer = document.getElementById('progressContainer');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressPercent = document.getElementById('progressPercent');

        if (!fileInput.files.length) return;

        const file = fileInput.files[0];

        const reader = new FileReader();
        reader.onload = async function(event) {
            const text = event.target.result;
            const totalLines = (text.match(/-->/g) || []).length;
            
            btnSubmit.disabled = true;
            statusDiv.className = 'loading';
            statusDiv.innerText = 'فایل ارسال شد. در حال ترجمه دیالوگ‌ها...';
            progressContainer.style.display = 'block';
            
            let currentPercent = 0;
            progressBarFill.style.width = '0%';
            progressPercent.innerText = '۰%';

            const estimatedTimeMs = Math.max(totalLines * 40, 3000);
            const intervalStep = 100;
            const percentIncrement = (intervalStep / estimatedTimeMs) * 92;

            const progressInterval = setInterval(() => {
                if (currentPercent < 92) {
                    currentPercent += percentIncrement;
                    if (currentPercent > 92) currentPercent = 92;
                    
                    const displayPercent = Math.round(currentPercent);
                    progressBarFill.style.width = `${displayPercent}%`;
                    progressPercent.innerText = `${displayPercent.toLocaleString('fa-IR')}%`;
                    
                    if (displayPercent >= 92) {
                        document.querySelector('.progress-text span:last-child').innerText = 'در حال بازسازی و دریافت فایل نهایی...';
                    }
                }
            }, intervalStep);

            const formData = new FormData();
            formData.append('file', file);
            formData.append('to', langTo);
            formData.append('api_key', apiKey); // ارسال داینامیک کلید به بک‌اند

            try {
                const response = await fetch('/translate-srt', {
                    method: 'POST',
                    body: formData
                });

                clearInterval(progressInterval);

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.details || 'خطا در ترجمه فایل');
                }

                progressBarFill.style.width = '100%';
                progressPercent.innerText = '۱۰۰%';

                const blob = await response.blob();
const url = window.URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;

// 🟢 استخراج نام اصلی فایل بدون پسوند srt.
const outputFileName = file.name.replace(/\.srt$/i, ''); 
a.download = `${outputFileName}_GrqFa.srt`;

document.body.appendChild(a);
a.click();
a.remove();


                statusDiv.className = 'success';
                statusDiv.innerText = 'ترجمه با موفقیت انجام و فایل دانلود شد!';

            } catch (error) {
                clearInterval(progressInterval);
                progressBarFill.style.width = '0%';
                progressPercent.innerText = '۰%';
                statusDiv.className = 'error';
                statusDiv.innerText = 'خطا: ' + error.message;
            } finally {
                btnSubmit.disabled = false;
            }
        };

        reader.readAsText(file);
    });
</script>

</body>
</html>
