<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرکز جامع پردازش صوت و زیرنویس</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #e0e0e0;
            --text-muted: #a3a3a3;
            --input-bg: #252525;
            --border-color: #374151;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 550px;
        }

        /* طراحی تب‌ها */
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
            gap: 5px;
            overflow-x: auto;
        }
        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 14px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tab-btn:hover { color: #fff; }
        .tab-btn.active {
            color: #a5b4fc;
            border-bottom-color: var(--primary);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        h3 { text-align: center; color: #fff; margin-top: 0; margin-bottom: 20px; }

        /* فیلدها و دکمه‌ها */
        .form-group { margin-bottom: 18px; text-align: right; }
        label { display: block; margin-bottom: 8px; color: #a5b4fc; font-weight: bold; font-size: 13px; }
        select, input[type="text"] {
            width: 100%; padding: 12px; background-color: var(--input-bg);
            border: 1px solid var(--border-color); border-radius: 8px; color: #fff;
            font-size: 13px; box-sizing: border-box;
        }

        .custom-file-upload {
            border: 2px dashed var(--primary); display: block; padding: 16px;
            cursor: pointer; border-radius: 12px; text-align: center; background-color: var(--input-bg);
            color: var(--text-muted); font-weight: bold; font-size: 13px; transition: all 0.3s;
        }
        .custom-file-upload:hover { background-color: var(--primary); color: #fff; }

        button.btn-action {
            background-color: var(--primary); color: white; border: none; padding: 14px;
            font-size: 15px; border-radius: 12px; cursor: pointer; width: 100%;
            font-weight: bold; transition: background 0.3s; margin-top: 10px;
        }
        button.btn-action:hover { background-color: var(--primary-hover); }
        button.btn-action:disabled { background-color: #4b5563; cursor: not-allowed; }

        .btn-download {
            background-color: var(--success); display: none; color: white; border: none;
            padding: 14px; font-size: 15px; border-radius: 12px; cursor: pointer; width: 100%;
            font-weight: bold; margin-top: 10px; text-align: center;
        }

        /* نوار پیشرفت */
        .progress-container { display: none; margin: 20px 0; text-align: right; }
        .progress-bar-wrapper { background-color: #2d2d2d; border-radius: 10px; height: 10px; overflow: hidden; margin-top: 6px; }
        .progress-bar { background-color: var(--primary); height: 100%; width: 0%; transition: width 0.2s linear; }
        .progress-status { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }

        .status-box { margin-top: 15px; text-align: center; font-size: 13px; font-weight: 500; }
        .warning-box { background-color: #450a0a; color: #fca5a5; border: 1px solid #991b1b; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 15px; text-align: right; display: none; }
        
        #outputSrt { background-color: #252525; padding: 10px; border-radius: 8px; direction: ltr; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; display: none; margin-top: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="card">
    <!-- نوار تب‌ها -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab1')">🎙️ صوت به SRT</button>
        <button class="tab-btn" onclick="switchTab('tab2')">🧠 ترجمه AI</button>
        <button class="tab-btn" onclick="switchTab('tab3')">⚡ ترجمه سریع</button>
        <button class="tab-btn" onclick="switchTab('tabSettings')">⚙️ تنظیمات API</button>
    </div>

    <!-- تب ۱: تبدیل صوت به SRT -->
    <div id="tab1" class="tab-content active">
        <h3>تبدیل فایل صوتی به زیرنویس SRT</h3>
        <div class="warning-box" id="tab1Warning">⚠️ حجم فایل بیش از ۲۵ مگابایت است! لطفاً آن را فشرده کنید.</div>
        <form id="formStt">
            <div class="form-group">
                <label for="audioFile" class="custom-file-upload" id="audioLabel">انتخاب فایل صوتی (تا ۲۵MB)</label>
                <input type="file" id="audioFile" accept="audio/*" style="display:none" required>
            </div>
            <button type="submit" class="btn-action" id="btnSttSubmit">استخراج و ساخت SRT 🚀</button>
        </form>
        <div class="progress-container" id="progContainer1">
            <div class="progress-status"><span id="progState1">در حال آماده‌سازی...</span><span id="progPerc1">0%</span></div>
            <div class="progress-bar-wrapper"><div class="progress-bar" id="progBar1"></div></div>
        </div>
        <div id="outputSrt"></div>
        <button class="btn-download" id="btnSttDownload">دانلود زیرنویس (SRT) 📥</button>
    </div>

    <!-- تب ۲: ترجمه با AI -->
    <div id="tab2" class="tab-content">
        <h3>ترجمه هوشمند با Groq (Llama-3.3)</h3>
        <form id="formAi">
            <div class="form-group">
                <label for="srtAiFile" class="custom-file-upload" id="srtAiLabel">انتخاب فایل زیرنویس (SRT) 📄</label>
                <input type="file" id="srtAiFile" accept=".srt" style="display:none" required>
            </div>
            <div class="form-group">
                <label for="langAi">ترجمه به زبان:</label>
                <select id="langAi">
                    <option value="fa">فارسی روان (Persian)</option>
                    <option value="en">انگلیسی (English)</option>
                    <option value="ar">عربی (Arabic)</option>
                    <option value="tr">ترکی (Turkish)</option>
                </select>
            </div>
            <button type="submit" class="btn-action" id="btnAiSubmit">ترجمه با هوش مصنوعی 🧠</button>
        </form>
        <div class="progress-container" id="progContainer2">
            <div class="progress-status"><span id="progState2">در حال ترجمه دیالوگ‌ها...</span><span id="progPerc2">0%</span></div>
            <div class="progress-bar-wrapper"><div class="progress-bar" id="progBar2"></div></div>
        </div>
        <button class="btn-download" id="btnAiDownload">دانلود زیرنویس ترجمه‌شده 📥</button>
    </div>

    <!-- تب ۳: ترجمه سریع -->
    <div id="tab3" class="tab-content">
        <h3>ترجمه سریع زیرنویس (Google)</h3>
        <form id="formFast">
            <div class="form-group">
                <label for="srtFastFile" class="custom-file-upload" id="srtFastLabel">انتخاب فایل زیرنویس (SRT) 📄</label>
                <input type="file" id="srtFastFile" accept=".srt" style="display:none" required>
            </div>
            <div class="form-group">
                <label for="langFast">ترجمه به زبان:</label>
                <select id="langFast">
                    <option value="fa">فارسی (Persian)</option>
                    <option value="en">انگلیسی (English)</option>
                    <option value="ar">عربی (Arabic)</option>
                </select>
            </div>
            <button type="submit" class="btn-action" id="btnFastSubmit">ترجمه سریع ⚡</button>
        </form>
        <div class="progress-container" id="progContainer3">
            <div class="progress-status"><span id="progState3">در حال پردازش...</span><span id="progPerc3">0%</span></div>
            <div class="progress-bar-wrapper"><div class="progress-bar" id="progBar3"></div></div>
        </div>
        <button class="btn-download" id="btnFastDownload">دانلود زیرنویس ترجمه‌شده 📥</button>
    </div>

    <!-- تب ۴: تنظیمات -->
    <div id="tabSettings" class="tab-content">
        <h3>⚙️ مدیریت کلیدهای Groq API</h3>
        <div class="form-group">
            <label>ثبت کلید جدید:</label>
            <div style="display:flex; gap:8px;">
                <input type="text" id="apiLabel" placeholder="نام/مشخصه" style="width:35%">
                <input type="text" id="apiKeyVal" placeholder="gsk_..." style="direction:ltr">
            </div>
            <button class="btn-action" style="margin-top:8px" onclick="saveApiKey()">ثبت کلید</button>
        </div>
        <div class="form-group">
            <label>انتخاب کلید فعال:</label>
            <div style="display:flex; gap:8px;">
                <select id="apiSelect"></select>
                <button onclick="deleteApiKey()" style="background:var(--danger); color:#fff; border:none; padding:10px 14px; border-radius:8px; cursor:pointer;">🗑️</button>
            </div>
        </div>
        <hr style="border-color:var(--border-color); margin: 20px 0;">
        <div style="display:flex; gap:8px;">
            <button class="btn-action" style="background:#252525" onclick="exportKeys()">خروجی بکاپ 📥</button>
            <button class="btn-action" style="background:#252525" onclick="document.getElementById('fileImport').click()">وارد کردن 📤</button>
            <input type="file" id="fileImport" accept=".json" style="display:none" onchange="importKeys(this)">
        </div>
    </div>

    <div class="status-box" id="statusBox"></div>
</div>

<script>
    // --- مدیریت تب‌ها ---
    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        event.currentTarget.classList.add('active');
        document.getElementById(tabId).classList.add('active');
        document.getElementById('statusBox').innerText = '';
    }

    // --- مدیریت کلیدهای API ---
    let apiKeys = JSON.parse(localStorage.getItem('app_groq_keys') || '[]');

    function updateApiSelect() {
        const select = document.getElementById('apiSelect');
        select.innerHTML = '<option value="">-- انتخاب کلید فعال --</option>';
        apiKeys.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.key;
            opt.textContent = `${item.label} (${item.key.substring(0,7)}...)`;
            select.appendChild(opt);
        });
        select.value = localStorage.getItem('active_groq_key') || '';
    }

    function saveApiKey() {
        const label = document.getElementById('apiLabel').value.trim();
        const key = document.getElementById('apiKeyVal').value.trim();
        if(!label || !key) return alert('نام و کلید را وارد کنید.');
        
        apiKeys.push({label, key});
        localStorage.setItem('app_groq_keys', JSON.stringify(apiKeys));
        localStorage.setItem('active_groq_key', key);
        document.getElementById('apiLabel').value = '';
        document.getElementById('apiKeyVal').value = '';
        updateApiSelect();
        alert('کلید ذخیره شد.');
    }

    function deleteApiKey() {
        const val = document.getElementById('apiSelect').value;
        if(!val) return;
        apiKeys = apiKeys.filter(x => x.key !== val);
        localStorage.setItem('app_groq_keys', JSON.stringify(apiKeys));
        localStorage.removeItem('active_groq_key');
        updateApiSelect();
    }

    function exportKeys() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(apiKeys));
        const a = document.createElement('a'); a.href = dataStr; a.download = "groq_keys_backup.json"; a.click();
    }

    function importKeys(input) {
        const file = input.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if(Array.isArray(data)) {
                    apiKeys = data;
                    localStorage.setItem('app_groq_keys', JSON.stringify(apiKeys));
                    updateApiSelect();
                    alert('کلیدها با موفقیت بازیابی شدند.');
                }
            } catch(err) { alert('فرمت JSON نامعتبر است.'); }
        };
        reader.readAsText(file);
    }

    document.getElementById('apiSelect').addEventListener('change', function() {
        localStorage.setItem('active_groq_key', this.value);
    });
    updateApiSelect();

    // --- مدیریت انتخاب فایل‌ها ---
    function setupFileInput(inputId, labelId) {
        document.getElementById(inputId).addEventListener('change', function() {
            if(this.files && this.files[0]) {
                document.getElementById(labelId).textContent = `📄 ${this.files[0].name}`;
                document.getElementById(labelId).style.borderColor = 'var(--success)';
            }
        });
    }
    setupFileInput('audioFile', 'audioLabel');
    setupFileInput('srtAiFile', 'srtAiLabel');
    setupFileInput('srtFastFile', 'srtFastLabel');

    // --- کنترل حجم فایل صوتی ---
    document.getElementById('audioFile').addEventListener('change', function() {
        const warn = document.getElementById('tab1Warning');
        const btn = document.getElementById('btnSttSubmit');
        if(this.files[0] && this.files[0].size > 25 * 1024 * 1024) {
            warn.style.display = 'block';
            btn.disabled = true;
        } else {
            warn.style.display = 'none';
            btn.disabled = false;
        }
    });

    // --- اکشن تب ۱: تبدیل صوت ---
    let srtResultText = "";
    document.getElementById('formStt').addEventListener('submit', function(e) {
        e.preventDefault();
        const apiKey = localStorage.getItem('active_groq_key');
        if(!apiKey) return alert('لطفاً ابتدا کلید API را در تب تنظیمات مشخص کنید.');

        const file = document.getElementById('audioFile').files[0];
        const formData = new FormData();
        formData.append('file', file);
        formData.append('api_key', apiKey);

        const progCont = document.getElementById('progContainer1');
        const progBar = document.getElementById('progBar1');
        const progPerc = document.getElementById('progPerc1');
        const progState = document.getElementById('progState1');

        progCont.style.display = 'block';
        progBar.style.width = '0%';

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/transcribe-aac');
        
        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const p = Math.round((e.loaded / e.total) * 100);
                progBar.style.width = p + '%';
                progPerc.innerText = p + '%';
                progState.innerText = p < 100 ? 'در حال آپلود...' : 'در حال پردازش گراک...';
            }
        };

        xhr.onload = function() {
            if(xhr.status === 200) {
                const res = JSON.parse(xhr.responseText);
                if(res.segments) {
                    srtResultText = convertToSRT(res.segments);
                    document.getElementById('outputSrt').style.display = 'block';
                    document.getElementById('outputSrt').innerText = srtResultText;
                    document.getElementById('btnSttDownload').style.display = 'block';
                    progState.innerText = 'تکمیل شد! 🎉';
                }
            } else {
                alert('خطا در پردازش فایل صوتی.');
            }
        };
        xhr.send(formData);
    });

    function formatSRTTime(s) {
        const d = new Date(s * 1000);
        const hh = String(Math.floor(s / 3600)).padStart(2, '0');
        const mm = String(d.getUTCMinutes()).padStart(2, '0');
        const ss = String(d.getUTCSeconds()).padStart(2, '0');
        const ms = String(d.getUTCMilliseconds()).padStart(3, '0');
        return `${hh}:${mm}:${ss},${ms}`;
    }

    function convertToSRT(segments) {
        return segments.map((s, i) => `${i + 1}\n${formatSRTTime(s.start)} --> ${formatSRTTime(s.end)}\n${s.text.trim()}\n`).join('\n');
    }

    document.getElementById('btnSttDownload').addEventListener('click', function() {
        const blob = new Blob([srtResultText], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "subtitle.srt";
        a.click();
    });

    // --- تابع متداول فرستادن فرم‌های ترجمه ---
    async function handleTranslation(endpoint, fileInputId, langSelectId, containerId, barId, percId, btnDownloadId) {
        const apiKey = localStorage.getItem('active_groq_key');
        if(endpoint.includes('ai') && !apiKey) return alert('لطفاً ابتدا کلید API را انتخاب کنید.');

        const file = document.getElementById(fileInputId).files[0];
        const formData = new FormData();
        formData.append('file', file);
        formData.append('to', document.getElementById(langSelectId).value);
        if(apiKey) formData.append('api_key', apiKey);

        const progCont = document.getElementById(containerId);
        const progBar = document.getElementById(barId);
        const progPerc = document.getElementById(percId);

        progCont.style.display = 'block';
        progBar.style.width = '30%'; progPerc.innerText = '30%';

        try {
            const res = await fetch(endpoint, { method: 'POST', body: formData });
            if(!res.ok) throw new Error('خطا در سرور');

            progBar.style.width = '100%'; progPerc.innerText = '100%';
            const blob = await res.blob();
            const btnDown = document.getElementById(btnDownloadId);
            btnDown.style.display = 'block';
            btnDown.onclick = function() {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `translated_${file.name}`;
                a.click();
            };
        } catch(err) {
            alert('خطا در فرایند ترجمه.');
        }
    }

    document.getElementById('formAi').addEventListener('submit', (e) => {
        e.preventDefault();
        handleTranslation('/api/translate-ai', 'srtAiFile', 'langAi', 'progContainer2', 'progBar2', 'progPerc2', 'btnAiDownload');
    });

    document.getElementById('formFast').addEventListener('submit', (e) => {
        e.preventDefault();
        handleTranslation('/api/translate-fast', 'srtFastFile', 'langFast', 'progContainer3', 'progBar3', 'progPerc3', 'btnFastDownload');
    });
</script>
</body>
</html>
