<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat UI — Tabitoken proxy / Direct</title>
  <!-- deploy-timestamp: 2026-08-15T06:25:18Z -->
  <style>
    body{font-family:system-ui,Segoe UI,Roboto;max-width:900px;margin:20px auto;padding:10px;direction:rtl}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    input[type=text], input[type=password], select{padding:8px;border:1px solid #ccc;border-radius:6px;width:100%}
    .col{flex:1;min-width:220px}
    #chat{border:1px solid #ddd;border-radius:8px;padding:12px;min-height:300px;overflow:auto;background:#fafafa}
    .msg{margin:8px 0;padding:10px;border-radius:8px;max-width:80%;}
    .user{background:#e6f7ff;margin-left:auto}
    .assistant{background:#fff;border:1px solid #eee}
    #composer{display:flex;gap:8px;margin-top:8px}
    textarea{flex:1;padding:8px;border-radius:6px;border:1px solid #ccc;min-height:70px}
    button{padding:8px 14px;border-radius:6px;border:none;background:#0366d6;color:#fff;cursor:pointer}
    .small{font-size:12px;color:#666;margin-top:6px}
    .row{display:flex;gap:8px;align-items:center}
    label{font-size:13px;color:#333}
    code{background:#f1f1f1;padding:2px 6px;border-radius:4px}
  </style>
</head>
<body>
  <h2>رابط چت (Tabitoken)</h2>

  <div class="controls">
    <div class="col">
      <label>Endpoint (برای تست مستقیم)</label>
      <input id="endpoint" type="text" value="https://tabitoken.com/v1/chat/completions" />
    </div>
    <div class="col">
      <label>Model</label>
      <input id="model" type="text" value="claude-opus-5-thinking" />
    </div>
    <div class="col">
      <label>API Key (برای تست مستقیم: فقط برای تست موقتی، خطر امنیتی دارد)</label>
      <input id="apiKey" type="password" placeholder="Bearer sk-... یا فقط کلید را وارد کنید" />
    </div>
  </div>

  <div id="chat" aria-live="polite"></div>

  <div id="composer">
    <textarea id="input" placeholder="پیام خود را اینجا بنویسید..."></textarea>
    <div style="display:flex;flex-direction:column">
      <button id="sendBtn" type="button">ارسال</button>
      <button id="clearBtn" style="margin-top:8px;background:#6c757d" type="button">پاک کردن</button>
    </div>
  </div>

  <div class="small">
    هشدار امنیتی: وارد کردن API Key در کلاینت (مرورگر) ناامن است و برای تست‌های موقت مجاز است، اما در محیط تولید از پراکسی و متغیرهای محیطی استفاده کنید.
  </div>

  <script>
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const endpointEl = document.getElementById('endpoint');
    const modelEl = document.getElementById('model');
    const apiKeyEl = document.getElementById('apiKey');

    // By default use the direct Tabitoken endpoint (as requested). You can switch to /api/proxy if desired.
    let messages = [];

    function renderMessages() {
      chatEl.innerHTML = '';
      messages.forEach(m => {
        if (m.role === 'system') return; // مخفی کردن system از لیست نمایش
        const d = document.createElement('div');
        d.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
        d.textContent = m.content;
        chatEl.appendChild(d);
      });
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      const endpoint = endpointEl.value.trim();
      const model = modelEl.value.trim() || 'claude-opus-5-thinking';
      const apiKey = apiKeyEl.value.trim();

      messages.push({ role: 'user', content: text });
      renderMessages();
      inputEl.value = '';
      sendBtn.disabled = true;
      sendBtn.textContent = 'در حال ارسال...';

      try {
        const payload = { model, messages: messages.filter(m => m.role !== 'system') };

        const headers = { 'Content-Type': 'application/json' };
        if (apiKey) headers['Authorization'] = apiKey.startsWith('Bearer') ? apiKey : 'Bearer ' + apiKey;

        const resp = await fetch(endpoint, {
          method: 'POST',
          headers,
          body: JSON.stringify(payload),
          mode: 'cors'
        });

        console.log('fetch status', resp.status, resp.statusText);
        const textResp = await resp.text();
        console.log('raw response text:', textResp);
        let data;
        try { data = JSON.parse(textResp); } catch (_) { data = textResp; }

        let assistantText = '';

        if (typeof data === 'string') {
          assistantText = data;
        } else if (data) {
          if (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) {
            assistantText = data.choices[0].message.content;
          } else if (data.choices && data.choices[0] && (data.choices[0].text || data.choices[0].content)) {
            assistantText = data.choices[0].text || data.choices[0].content;
          } else if (data.output && Array.isArray(data.output) && data.output[0] && data.output[0].content) {
            assistantText = data.output[0].content;
          } else if (data.message && data.message.content) {
            assistantText = data.message.content;
          } else if (data.error) {
            assistantText = 'خطا: ' + (data.error.message || data.error);
          } else {
            assistantText = JSON.stringify(data, null, 2);
          }
        } else {
          assistantText = 'پاسخ غیرقابل خواندن از سرور';
        }

        messages.push({ role: 'assistant', content: assistantText });
        renderMessages();

      } catch (err) {
        console.error(err);
        messages.push({ role: 'assistant', content: 'خطا در ارتباط: ' + (err.message || err) });
        renderMessages();
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'ارسال';
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      // جلوگیری از submit فرم با Enter و ارسال تنها با Ctrl+Enter یا Cmd+Enter
      if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        return;
      }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        sendMessage();
      }
    });
    clearBtn.addEventListener('click', () => { messages = []; renderMessages(); });

    messages.push({ role: 'system', content: 'شما در یک رابط چت ساده هستید.' });
    renderMessages();
  </script>
</body>
</html>
